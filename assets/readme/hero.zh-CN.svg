<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">脑雾友好</title>
  <desc id="desc">Brain Fog Friendly 的平静 README 首图，这是一个面向 Claude Code、Codex 和 ChatGPT 的插件，提供十种语言的简短、温和、分步骤回复。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F5EFE4"/>
    </linearGradient>
    <linearGradient id="calm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BDE8D6"/>
      <stop offset="1" stop-color="#91CFBB"/>
    </linearGradient>
    <filter id="lift" x="-16%" y="-16%" width="132%" height="132%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#263129" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="30" fill="#F8F3EA"/>
  <path d="M0 348 C170 318 252 382 394 354 C550 324 596 256 762 284 C928 314 1012 364 1200 326 L1200 420 L0 420 Z" fill="#E5F3EC" opacity="0.76"/>

  <g id="title-block" transform="translate(64 54)">
    <rect x="0" y="0" width="338" height="34" rx="17" fill="#E8E1F4"/>
    <text x="20" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#55496B" letter-spacing="1.1">CLAUDE CODE · CODEX · CHATGPT</text>

    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans, Noto Sans, Arial, sans-serif" font-size="58" font-weight="780" fill="#243028">脑雾友好</text>
    <text x="0" y="178" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans, Noto Sans, Arial, sans-serif" font-size="25" font-weight="520" fill="#4B5A52">低认知负荷回复风格，</text>
    <text x="0" y="212" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans, Noto Sans, Arial, sans-serif" font-size="25" font-weight="520" fill="#4B5A52">让帮助更平静、更分步骤。</text>

    <g transform="translate(0 300)">
      <rect x="0" y="0" width="154" height="42" rx="21" fill="#243028"/>
      <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans, Noto Sans, Arial, sans-serif" font-size="18" font-weight="690" fill="#FFFFFF">10 种语言</text>
      <rect x="170" y="0" width="220" height="42" rx="21" fill="#FFFFFF" stroke="#D8D0C4"/>
      <text x="194" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans, Noto Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#3E4A43">一次一小步</text>
    </g>
  </g>

  <g id="calm-flow" transform="translate(612 48)">
    <rect x="0" y="0" width="524" height="324" rx="28" fill="url(#paper)" filter="url(#lift)"/>
    <g transform="translate(36 34)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7B6F62">输出风格</text>
      <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans, Noto Sans, Arial, sans-serif" font-size="28" font-weight="730" fill="#243028">少一点负担，多一点清晰</text>
    </g>

    <g transform="translate(36 102)">
      <circle cx="18" cy="18" r="18" fill="url(#calm)"/>
      <text x="13" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#243028">1</text>
      <text x="56" y="25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans, Noto Sans, Arial, sans-serif" font-size="23" font-weight="650" fill="#243028">结论先行</text>
      <circle cx="18" cy="82" r="18" fill="#E8E1F4"/>
      <text x="13" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#55496B">2</text>
      <text x="56" y="89" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans, Noto Sans, Arial, sans-serif" font-size="23" font-weight="650" fill="#243028">短句短段</text>
      <circle cx="18" cy="146" r="18" fill="#F3D3BE"/>
      <text x="13" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#6B4938">3</text>
      <text x="56" y="153" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans, Noto Sans, Arial, sans-serif" font-size="23" font-weight="650" fill="#243028">下一步更小</text>
    </g>

    <g transform="translate(326 96)">
      <rect x="0" y="0" width="150" height="42" rx="14" fill="#FFFFFF" stroke="#D8D0C4"/>
      <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans, Noto Sans, Arial, sans-serif" font-size="18" font-weight="680" fill="#243028">English</text>
      <rect x="-18" y="55" width="168" height="42" rx="14" fill="#FFFFFF" stroke="#D8D0C4"/>
      <text x="0" y="83" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans, Noto Sans, Arial, sans-serif" font-size="18" font-weight="680" fill="#243028">脑雾友好</text>
      <rect x="0" y="110" width="150" height="42" rx="14" fill="#FFFFFF" stroke="#D8D0C4"/>
      <text x="18" y="137" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans, Noto Sans, Arial, sans-serif" font-size="18" font-weight="680" fill="#243028">日本語</text>
      <rect x="-18" y="165" width="168" height="42" rx="14" fill="#FFFFFF" stroke="#D8D0C4"/>
      <text x="0" y="193" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans, Noto Sans, Arial, sans-serif" font-size="18" font-weight="680" fill="#243028">Español</text>
    </g>
  </g>
</svg>
